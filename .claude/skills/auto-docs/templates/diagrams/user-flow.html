<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Flow — {{PROJECT_NAME}}</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
    .header { background: #1a1d2e; border-bottom: 1px solid #2d3148; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    .header-left h1 { font-size: 18px; font-weight: 600; color: #fff; }
    .header-left p { font-size: 12px; color: #64748b; margin-top: 2px; }
    .badge { background: #1a1f14; color: #86efac; font-size: 11px; padding: 4px 10px; border-radius: 20px; border: 1px solid #166534; }
    .tabs { padding: 0 24px; background: #13161f; border-bottom: 1px solid #1e2235; display: flex; gap: 0; }
    .tab { padding: 10px 16px; font-size: 12px; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab.active { color: #60a5fa; border-bottom-color: #3b82f6; }
    .links { padding: 8px 24px; background: #13161f; border-bottom: 1px solid #0f1117; display: flex; gap: 16px; }
    .links a { font-size: 12px; color: #60a5fa; text-decoration: none; }
    .main { display: flex; height: calc(100vh - 110px); }
    .diagram-panel { flex: 1; padding: 24px; overflow: auto; display: flex; justify-content: center; }
    .diagram-box { background: #1a1d2e; border: 1px solid #2d3148; border-radius: 12px; padding: 32px; width: 100%; max-width: 900px; height: fit-content; }
    .diagram-box h2 { font-size: 13px; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 20px; }
    #diagram { text-align: center; }
    .editor-panel { width: 380px; background: #13161f; border-left: 1px solid #1e2235; display: flex; flex-direction: column; }
    .editor-header { padding: 16px; border-bottom: 1px solid #1e2235; }
    .editor-header h3 { font-size: 13px; font-weight: 600; }
    .editor-header p { font-size: 11px; color: #64748b; margin-top: 4px; }
    textarea { flex: 1; background: #0f1117; color: #a8b4c8; border: none; padding: 16px; font-family: monospace; font-size: 12px; line-height: 1.6; resize: none; outline: none; }
    .editor-footer { padding: 12px 16px; border-top: 1px solid #1e2235; display: flex; gap: 8px; }
    button { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; }
    .btn-render { background: #3b82f6; color: #fff; flex: 1; }
    .btn-copy { background: #1e2235; color: #94a3b8; }
    .last-updated { padding: 8px 16px; font-size: 11px; color: #475569; border-top: 1px solid #1e2235; }
    .mermaid svg { max-width: 100%; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <h1>User Flow Diagram</h1>
      <p>{{PROJECT_NAME}} — User Navigation Paths</p>
    </div>
    <span class="badge">FRD + User Stories</span>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="loadFlow('auth')">Auth Flow</div>
    <div class="tab" onclick="loadFlow('onboarding')">Onboarding</div>
    <div class="tab" onclick="loadFlow('core')">Core Feature</div>
  </div>
  <div class="links">
    <a href="../requirements/FRD.md">← FRD.md</a>
    <a href="../requirements/USER_STORIES.md">User Stories</a>
  </div>
  <div class="main">
    <div class="diagram-panel">
      <div class="diagram-box">
        <h2 id="flow-title">Authentication Flow</h2>
        <div id="diagram" class="mermaid"></div>
      </div>
    </div>
    <div class="editor-panel">
      <div class="editor-header">
        <h3>Edit User Flow Source</h3>
        <p>Update when UI changes or new user journeys are added to the product.</p>
      </div>
      <textarea id="source"></textarea>
      <div class="editor-footer">
        <button class="btn-render" onclick="renderDiagram()">Render</button>
        <button class="btn-copy" onclick="copySource()">Copy</button>
      </div>
      <div class="last-updated">Last updated: {{DATE}} &nbsp;|&nbsp; By: PM / Tech Lead</div>
    </div>
  </div>
  <script>
    const flows = {
      auth: {
        title: 'Authentication Flow',
        source: `flowchart TD
    Start([User visits app]) --> HasAccount{Has account?}
    HasAccount -->|No| Register[Go to Register page]
    HasAccount -->|Yes| Login[Go to Login page]

    Register --> FillForm[Fill name, email, password]
    FillForm --> Submit[Click Register]
    Submit --> Valid{Valid input?}
    Valid -->|No| ShowError[Show validation error]
    ShowError --> FillForm
    Valid -->|Yes| SendVerify[Send verification email]
    SendVerify --> CheckEmail[User checks email]
    CheckEmail --> ClickLink[Click verification link]
    ClickLink --> Verified[Account verified]
    Verified --> Dashboard

    Login --> EnterCreds[Enter email + password]
    EnterCreds --> CheckCreds{Credentials valid?}
    CheckCreds -->|No| LoginError[Show error]
    LoginError --> EnterCreds
    CheckCreds -->|Yes| Dashboard[Dashboard 🏠]

    style Start fill:#3b82f6,color:#fff
    style Dashboard fill:#10b981,color:#fff
    style ShowError fill:#ef4444,color:#fff
    style LoginError fill:#ef4444,color:#fff`
      },
      onboarding: {
        title: 'User Onboarding Flow',
        source: `flowchart TD
    Start([New user — first login]) --> Welcome[Welcome screen]
    Welcome --> Step1[Step 1: Set up profile]
    Step1 --> Step2[Step 2: Choose preferences]
    Step2 --> Step3[Step 3: Connect integrations]
    Step3 --> Skip{Skip remaining?}
    Skip -->|Yes| Dashboard
    Skip -->|No| Step4[Step 4: Invite team]
    Step4 --> Dashboard[Dashboard 🏠]

    style Start fill:#8b5cf6,color:#fff
    style Dashboard fill:#10b981,color:#fff`
      },
      core: {
        title: 'Core Feature Flow',
        source: `flowchart TD
    Start([User on dashboard]) --> Action[Click primary action]
    Action --> Check{Permissions OK?}
    Check -->|No| Denied[Show permission error]
    Check -->|Yes| Form[Show feature form]
    Form --> Input[User fills in details]
    Input --> Validate{Valid?}
    Validate -->|No| ShowErr[Highlight errors]
    ShowErr --> Input
    Validate -->|Yes| Process[System processes]
    Process --> Success{Success?}
    Success -->|No| SystemErr[Show system error]
    Success -->|Yes| Confirm[Show confirmation]
    Confirm --> Dashboard[Return to dashboard]

    style Start fill:#3b82f6,color:#fff
    style Confirm fill:#10b981,color:#fff
    style Denied fill:#ef4444,color:#fff
    style SystemErr fill:#ef4444,color:#fff`
      }
    };

    mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });

    function loadFlow(key) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      const f = flows[key];
      document.getElementById('flow-title').textContent = f.title;
      document.getElementById('source').value = f.source;
      renderDiagram();
    }

    async function renderDiagram() {
      const source = document.getElementById('source').value;
      const el = document.getElementById('diagram');
      el.removeAttribute('data-processed');
      el.innerHTML = source;
      await mermaid.run({ nodes: [el] });
    }

    function copySource() { navigator.clipboard.writeText(document.getElementById('source').value); }
    loadFlow('auth');
  </script>
</body>
</html>
